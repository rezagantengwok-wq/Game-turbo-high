<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Turbo Ultimate 144 FPS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c20, #060409);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .turbo-container {
            background: rgba(20, 15, 35, 0.85);
            border: 2px solid #00f0ff;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 24px;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .subtitle {
            font-size: 12px;
            color: #8a85a0;
            margin-bottom: 25px;
        }
        .status-display {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
        }
        .status-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            width: 45%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .status-label {
            font-size: 11px;
            color: #a0a0a0;
            text-transform: uppercase;
        }
        .status-value {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            margin-top: 5px;
            transition: color 0.3s;
        }
        .fps-active {
            color: #00ff66 !important;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }
        .boost-btn {
            background: linear-gradient(45deg, #ff0055, #00f0ff);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
            transition: all 0.3s ease;
            width: 100%;
        }
        .boost-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 25px rgba(0, 240, 255, 0.6);
        }
        .boost-btn:disabled {
            background: #333;
            color: #777;
            box-shadow: none;
            cursor: not-allowed;
        }
        .log-box {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            color: #00ff66;
            text-align: left;
            height: 60px;
            overflow-y: hidden;
            border: 1px solid rgba(0, 255, 102, 0.2);
        }
    </style>
</head>
<body>

<div class="turbo-container">
    <h1>Game Turbo X</h1>
    <div class="subtitle">Performance Stabilizer v4.0</div>

    <div class="status-display">
        <div class="status-box">
            <div class="status-label">Current FPS</div>
            <div class="status-value" id="fps-val">60</div>
        </div>
        <div class="status-box">
            <div class="status-label">RAM Cleaned</div>
            <div class="status-value" id="ram-val">0%</div>
        </div>
    </div>

    <button class="boost-btn" id="boost-trigger" onclick="startBoost()">Activate 144 FPS</button>

    <div class="log-box" id="log-text">
        [System] Ready to optimize...
    </div>
</div>

<script>
    function startBoost() {
        const btn = document.getElementById('boost-trigger');
        const fpsVal = document.getElementById('fps-val');
        const ramVal = document.getElementById('ram-val');
        const logText = document.getElementById('log-text');

        btn.disabled = true;
        logText.innerHTML = "[System] Clearing background apps...<br>";

        // Simulasi pembersihan RAM
        let ram = 0;
        const ramInterval = setInterval(() => {
            ram += 12;
            if(ram > 85) {
                clearInterval(ramInterval);
                ramVal.innerText = "88%";
            } else {
                ramVal.innerText = ram + "%";
            }
        }, 100);

        // Simulasi Overclock & Boost FPS ke 144
        setTimeout(() => {
            logText.innerHTML += "[System] Injecting 144Hz Refresh Rate Display...<br>";
        }, 1000);

        setTimeout(() => {
            logText.innerHTML += "[Success] Ultra High FPS 144 Active!";
            fpsVal.innerText = "144";
            fpsVal.classList.add('fps-active');
            btn.innerText = "Turbo Active";
        }, 2200);
    }
</script>

</body>
</html>
